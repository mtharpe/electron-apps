# Services built by build.sh (macOS) and build-linux.sh (Linux).
# Shared by both so the list can't drift between platforms.
#
# Format:  name | icon | url | bundle-id | freedesktop-categories
#   name        display name; becomes the .app / .desktop name and the window title base
#   icon        basename in icons/ — icons/<icon>.icns (macOS), icons/png/<icon>.png (Linux)
#   url         the page the app wraps
#   bundle-id   macOS bundle identifier (ignored on Linux)
#   categories  Linux app-menu categories, ';'-terminated (ignored on macOS)
#
# To add a service: append a line here and drop in a matching icon.
SERVICES=(
  "Gmail|gmail|https://mail.google.com/|com.miketharpe.gmailapp|Network;Email;"
  "Google Calendar|calendar|https://calendar.google.com/|com.miketharpe.calendarapp|Office;Calendar;"
  # /embed/ is the panel Calendar hosts in an iframe: it takes its theme from the parent
  # frame, so standalone — with no parent to ask — it renders light no matter what the
  # desktop's colour scheme is. It also redirects to /tasks/ on its own, which is why a
  # manual reload "fixed" it. Point at the standalone view directly; it reads
  # prefers-color-scheme itself and comes up dark on the first load.
  "Google Tasks|tasks|https://tasks.google.com/tasks/|com.miketharpe.tasksapp|Office;ProjectManagement;"
  "Google Keep|keep|https://keep.google.com/|com.miketharpe.keepapp|Utility;TextEditor;"
  "Google Messages|messages|https://messages.google.com/web/|com.miketharpe.messagesapp|Network;InstantMessaging;"
  # Not a Google app. Tidal has no official Linux client, and its audio is Widevine-protected
  # — which is why this repo builds on castlabs' Electron rather than stock: stock ships no
  # CDM and playback is impossible in it, not merely degraded.
  "Tidal|tidal|https://listen.tidal.com/|com.miketharpe.tidalapp|AudioVideo;Audio;Player;"
  # Facebook Messenger. Meta retired the standalone messenger.com experience — a logged-in
  # user there is bounced into facebook.com — so the only surviving Messenger is the chat
  # view inside Facebook. Point at it directly, and styles/messenger.css trims Facebook's
  # chrome so it reads as Messenger rather than the whole site. (This is the same wall
  # Caprine and other Messenger clients hit.) Login is Facebook login.
  "Messenger|messenger|https://www.facebook.com/messages/t/|com.miketharpe.messengerapp|Network;InstantMessaging;"
)
