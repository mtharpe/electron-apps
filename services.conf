# Services built by build.sh (macOS) and build-linux.sh (Linux).
# Shared by both so the list can't drift between platforms.
#
# Format:  name | icon | url | bundle-id | freedesktop-categories
#   name        display name; becomes the .app / .desktop name and the window title base
#   icon        basename in icons/ — icons/<icon>.icns (macOS), icons/png/<icon>.png (Linux)
#   url         the page the app wraps
#   bundle-id   macOS bundle identifier (ignored on Linux)
#   categories  Linux app-menu categories, ';'-terminated (ignored on macOS)
#
# To add a service: append a line here and drop in a matching icon.
SERVICES=(
  "Gmail|gmail|https://mail.google.com/|com.miketharpe.gmailapp|Network;Email;"
  "Google Calendar|calendar|https://calendar.google.com/|com.miketharpe.calendarapp|Office;Calendar;"
  "Google Tasks|tasks|https://tasks.google.com/embed/?origin=https://calendar.google.com&fullWidth=1|com.miketharpe.tasksapp|Office;ProjectManagement;"
  "Google Keep|keep|https://keep.google.com/|com.miketharpe.keepapp|Utility;TextEditor;"
)
